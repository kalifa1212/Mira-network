spring:
  security:
    user:
      name: admin
      password: admin
        #  gestion des session jdbc
#  session:
#    jdbc:
#      initialize-schema: always
      ## Gmail configuration for sending email
  mail:
    host: smtp.gmail.com
    port: 587
    protoco: smtps
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtps
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 8000
    ## End
  jpa:
#    show-sql: true
    ##  Hibernate DDL create, update...
    hibernate:
      ddl-auto: update
    ## Generation du schemat de la base de donnee;
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ## setting time zone
#        jdbc:
#          time_zone: UTC+1
        ## configuration de envers
        org:
          hibernate:
            envers:
              default_schema: m_app_audit
    ## to allow circular and override bean definition
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
    ## multipart file configuration
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 20MB
      max-file-size: 20MB
      max-request-size: 30MB
    ## end
    ## allow OPTIONS request
